<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">Keputusan kontrol URL</title><desc id="d">Pilih autentikasi untuk data privat, redirect untuk URL pindah, noindex untuk mencegah indeks, canonical untuk duplikat, dan robots untuk membatasi crawling.</desc><rect width="1000" height="500" rx="24" fill="#fff"/><g font-family="Inter,Arial" text-anchor="middle"><rect x="365" y="30" width="270" height="65" rx="14" fill="#111827"/><text x="500" y="71" fill="#fff" font-size="22">Apa kebutuhan URL?</text><path d="M500 95v55M110 150h780" stroke="#94A3B8" stroke-width="4" fill="none"/><g fill="#EAF1FF" stroke="#1D4ED8" stroke-width="4"><rect x="25" y="180" width="170" height="80" rx="14"/><rect x="220" y="180" width="170" height="80" rx="14"/><rect x="415" y="180" width="170" height="80" rx="14"/><rect x="610" y="180" width="170" height="80" rx="14"/><rect x="805" y="180" width="170" height="80" rx="14"/></g><g fill="#111827" font-size="19"><text x="110" y="212">Data privat</text><text x="305" y="212">URL pindah</text><text x="500" y="212">Cegah indeks</text><text x="695" y="212">Duplikat</text><text x="890" y="212">Batasi crawl</text></g><g fill="#1D4ED8" font-size="20" font-weight="600"><text x="110" y="242">Autentikasi</text><text x="305" y="242">Redirect</text><text x="500" y="242">noindex</text><text x="695" y="242">Canonical</text><text x="890" y="242">robots.txt</text></g><path d="M110 150v30M305 150v30M500 150v30M695 150v30M890 150v30" stroke="#94A3B8" stroke-width="4"/><rect x="210" y="330" width="580" height="100" rx="16" fill="#F7F8FC" stroke="#DCE4F0" stroke-width="3"/><text x="500" y="370" fill="#111827" font-size="20">Crawler harus boleh mengakses URL agar noindex terbaca.</text><text x="500" y="404" fill="#475569" font-size="18">Kontrol dapat dikombinasikan hanya jika tujuannya tidak bertentangan.</text></g></svg>